<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>SIKSA OKA</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      user-select: none;
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #090b10;
      color: #f8fafc;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #arena-wrap {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      touch-action: none;
      z-index: 1;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    @keyframes popQuote {
      0% { transform: translate(-50%, 8px) scale(0.85); opacity: 0; }
      15% { transform: translate(-50%, 0px) scale(1.03); opacity: 1; }
      85% { transform: translate(-50%, -4px) scale(1); opacity: 1; }
      100% { transform: translate(-50%, -12px) scale(0.95); opacity: 0; }
    }
    .quote-bubble {
      animation: popQuote 2.1s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
  </style>
</head>
<body>
  <div id="arena-wrap">
    <canvas id="canvas-3d"></canvas>
    <canvas id="canvas-2d" class="hidden"></canvas>
    <div id="overlay-layer" class="pointer-events-none fixed inset-0 z-10 overflow-hidden"></div>
  </div>

  <!-- Compact Mobile-First Top Bar (No Title / No Corner Icon) -->
  <header class="fixed top-0 left-0 right-0 z-30 pointer-events-none px-2 pt-2 flex flex-col gap-1.5">
    <div class="pointer-events-auto flex items-center justify-between gap-1 bg-slate-950/85 backdrop-blur-md border border-slate-800/90 rounded-xl px-2 py-1.5 shadow-lg">
      <!-- HP & Combo -->
      <div class="flex items-center gap-1.5 min-w-0 flex-1">
        <div class="flex flex-col flex-1 min-w-[68px] max-w-[115px]">
          <div class="flex items-center justify-between text-[10px] font-bold leading-none mb-1">
            <span class="text-slate-300">OKA</span>
            <span id="hp-text" class="text-emerald-400">100%</span>
          </div>
          <div class="w-full h-2 bg-slate-800 rounded-full overflow-hidden border border-slate-700/70">
            <div id="hp-bar" class="h-full bg-gradient-to-r from-rose-500 via-amber-400 to-emerald-400 transition-all duration-150" style="width: 100%"></div>
          </div>
        </div>
        <div id="combo-badge" class="px-1.5 py-0.5 rounded-md bg-amber-500/15 border border-amber-500/40 text-amber-300 text-[11px] font-black tracking-tight shrink-0">
          x0
        </div>
      </div>

      <!-- Compact Action Buttons -->
      <div class="flex items-center gap-1 shrink-0">
        <button id="btn-dim" type="button" class="px-2 py-1 rounded-lg bg-indigo-600/90 active:scale-95 text-white text-[11px] font-extrabold tracking-wide border border-indigo-400/40">
          3D
        </button>

        <button id="btn-clear-traps" type="button" class="flex items-center gap-1 px-2 py-1 rounded-lg bg-rose-600/90 active:scale-95 text-white text-[11px] font-bold border border-rose-400/40" title="Hapus Semua Duri">
          <svg class="w-3.5 h-3.5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/>
          </svg>
          <span>Duri (<span id="trap-count">0</span>)</span>
        </button>

        <button id="btn-heal" type="button" class="flex items-center gap-1 px-2 py-1 rounded-lg bg-emerald-600/90 active:scale-95 text-white text-[11px] font-bold border border-emerald-400/40" title="Pulihkan Oka">
          <svg class="w-3.5 h-3.5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 5v14"/><path d="M5 12h14"/>
          </svg>
          <span class="hidden sm:inline">Pulih</span>
        </button>

        <button id="btn-skin-toggle" type="button" class="flex items-center gap-1 px-2 py-1 rounded-lg bg-sky-600/90 active:scale-95 text-white text-[11px] font-bold border border-sky-400/40" title="Kostum Oka">
          <svg class="w-3.5 h-3.5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20.38 3.46L16 2a4 4 0 0 1-8 0L3.62 3.46a2 2 0 0 0-1.34 2.23l.58 3.47a1 1 0 0 0 .99.84H6v10c0 1.1.9 2 2 2h8a2 2 0 0 0 2-2V10h2.15a1 1 0 0 0 .99-.84l.58-3.47a2 2 0 0 0-1.34-2.23z"/>
          </svg>
          <span>Skin</span>
        </button>

        <button id="btn-sound" type="button" class="p-1.5 rounded-lg bg-slate-800/95 active:scale-95 text-slate-200 border border-slate-700" title="Suara">
          <svg id="icon-sound-on" class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
          </svg>
          <svg id="icon-sound-off" class="w-3.5 h-3.5 hidden text-rose-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Map Selector Pills (Compact Horizontal Scroll) -->
    <div id="map-bar" class="pointer-events-auto flex items-center gap-1.5 overflow-x-auto no-scrollbar py-0.5"></div>

    <!-- Collapsible Oka Skin Picker -->
    <div id="skin-drawer" class="hidden pointer-events-auto bg-slate-950/92 backdrop-blur-md border border-slate-800 rounded-xl p-2 shadow-xl">
      <div class="flex items-center justify-between mb-1.5">
        <span class="text-[11px] font-bold text-slate-300 uppercase tracking-wider">Pilih Seragam / Skin Oka</span>
        <button id="btn-skin-close" type="button" class="text-[11px] text-slate-400 px-1.5 py-0.5 rounded bg-slate-800">Tutup</button>
      </div>
      <div id="skin-list" class="grid grid-cols-3 sm:grid-cols-6 gap-1.5"></div>
    </div>
  </header>

  <!-- Mobile-First Bottom Weapon Dock -->
  <footer class="fixed bottom-0 left-0 right-0 z-30 pointer-events-none px-2 pb-2">
    <div class="pointer-events-auto bg-slate-950/88 backdrop-blur-md border border-slate-800/90 rounded-2xl p-2 shadow-2xl">
      <!-- Category Tabs + Active Weapon Label -->
      <div class="flex items-center justify-between gap-2 mb-1.5">
        <div id="cat-tabs" class="flex items-center gap-1 overflow-x-auto no-scrollbar"></div>
        <div id="active-weapon-pill" class="shrink-0 px-2 py-0.5 rounded-md bg-slate-800 border border-slate-700 text-[11px] font-bold text-sky-300">
          Tangan Kosong
        </div>
      </div>
      <!-- Horizontal Weapon Grid -->
      <div id="weapon-list" class="flex items-center gap-1.5 overflow-x-auto no-scrollbar pb-0.5"></div>
    </div>
  </footer>

  <script src="game.js"></script>
</body>
</html>
