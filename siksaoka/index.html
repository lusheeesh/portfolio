<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>SIKSA OKA</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    /* Global mobile-first touch and highlight prevention */
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #090d16;
      color: #f8fafc;
      overscroll-behavior: none;
    }

    #game-canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      cursor: crosshair;
    }

    /* Hide scrollbars cleanly while keeping smooth horizontal touch scrolling */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Glassmorphic HUD panel styling */
    .glass-panel {
      background: rgba(15, 23, 42, 0.84);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-color: rgba(148, 163, 184, 0.16);
    }

    /* Subtle pulse for active unlock mode or combo */
    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 0 0 rgba(6, 182, 212, 0.35); }
      50% { box-shadow: 0 0 14px 2px rgba(6, 182, 212, 0.45); }
    }
    .active-tool-card {
      animation: pulseGlow 2.2s infinite ease-in-out;
    }
  </style>
</head>
<body class="flex flex-col bg-[#090d16] text-slate-100 select-none">

  <!-- TOP HUD HEADER -->
  <header class="glass-panel relative z-20 border-b px-3 py-2 sm:px-5 sm:py-2.5 shrink-0">
    <div class="max-w-6xl mx-auto flex flex-col gap-2">
      <!-- Row 1: Title, Currency & Live Damage/Combo -->
      <div class="flex items-center justify-between gap-2">
        <!-- Brand / Title -->
        <div class="flex items-center gap-2.5 min-w-0">
          <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-cyan-500/20 to-rose-500/20 border border-cyan-400/30 flex items-center justify-center shrink-0 shadow-inner">
            <svg class="w-5 h-5 text-cyan-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="5" r="3" />
              <path d="M12 8v6" />
              <path d="M7 11l5 1 5-1" />
              <path d="M9 21l3-7 3 7" />
            </svg>
          </div>
          <div class="min-w-0">
            <div class="flex items-center gap-1.5">
              <h1 class="text-base sm:text-lg font-black tracking-tight bg-gradient-to-r from-white via-cyan-200 to-cyan-400 bg-clip-text text-transparent truncate">
                SIKSA OKA
              </h1>
              <span class="hidden sm:inline-flex items-center px-1.5 py-0.5 rounded text-[10px] font-bold uppercase tracking-wider bg-cyan-500/15 text-cyan-300 border border-cyan-500/25">
                Sandbox
              </span>
            </div>
            <p class="text-[11px] text-slate-400 truncate leading-tight">Target: <span class="text-cyan-300 font-semibold">Oka</span></p>
          </div>
        </div>

        <!-- Stats Pills: Koin & Kombo/Damage -->
        <div class="flex items-center gap-1.5 sm:gap-2.5 shrink-0">
          <!-- Combo Badge (auto highlights during active combos) -->
          <div id="combo-pill" class="flex items-center gap-1.5 px-2.5 py-1.5 rounded-xl bg-slate-900/90 border border-slate-700/70 transition-all duration-150">
            <svg class="w-4 h-4 text-rose-400 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" />
            </svg>
            <div class="flex flex-col leading-none">
              <span class="text-[9px] uppercase tracking-wider text-slate-400 font-semibold">Kombo</span>
              <span id="combo-value" class="text-xs sm:text-sm font-extrabold text-rose-400 tabular-nums">x1</span>
            </div>
          </div>

          <!-- Koin Counter -->
          <div class="flex items-center gap-1.5 px-2.5 py-1.5 rounded-xl bg-slate-900/90 border border-amber-500/30 shadow-sm">
            <svg class="w-4 h-4 text-amber-400 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="9" />
              <path d="M12 7v10" />
              <path d="M9.5 9.5c0-1.1 1.1-2 2.5-2s2.5.9 2.5 2-1.1 2-2.5 2-2.5.9-2.5 2 1.1 2 2.5 2 2.5-.9 2.5-2" />
            </svg>
            <div class="flex flex-col leading-none">
              <span class="text-[9px] uppercase tracking-wider text-amber-300/80 font-semibold">Koin</span>
              <span id="coin-value" class="text-xs sm:text-sm font-extrabold text-amber-400 tabular-nums">250</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Row 2: Quick Action Buttons -->
      <div class="flex items-center justify-between gap-1.5 sm:gap-2">
        <!-- Audio Toggle -->
        <button id="btn-audio" type="button" class="flex items-center justify-center gap-1.5 px-2.5 py-1.5 rounded-xl bg-slate-800/90 hover:bg-slate-700/90 active:scale-95 border border-slate-700/80 text-xs font-semibold text-slate-200 transition">
          <svg id="icon-audio-on" class="w-4 h-4 text-cyan-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07" />
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14" />
          </svg>
          <svg id="icon-audio-off" class="w-4 h-4 text-slate-500 hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
            <line x1="23" y1="9" x2="17" y2="15" />
            <line x1="17" y1="9" x2="23" y2="15" />
          </svg>
          <span id="label-audio">Suara</span>
        </button>

        <!-- Heal / Reset Oka Button -->
        <button id="btn-heal" type="button" class="flex-1 sm:flex-initial flex items-center justify-center gap-1.5 px-3 py-1.5 rounded-xl bg-emerald-500/15 hover:bg-emerald-500/25 active:scale-95 border border-emerald-500/35 text-xs font-bold text-emerald-300 transition">
          <svg class="w-4 h-4 text-emerald-400 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8" />
            <path d="M21 3v5h-5" />
          </svg>
          <span>Pulihkan Oka</span>
        </button>

        <!-- Unlock All Sandbox Toggle -->
        <button id="btn-unlock-all" type="button" class="flex-1 sm:flex-initial flex items-center justify-center gap-1.5 px-3 py-1.5 rounded-xl bg-amber-500/15 hover:bg-amber-500/25 active:scale-95 border border-amber-500/40 text-xs font-bold text-amber-300 transition">
          <svg id="icon-unlock" class="w-4 h-4 text-amber-400 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
            <path d="M7 11V7a5 5 0 0 1 9.9-1" />
          </svg>
          <span id="label-unlock-all">Buka Semua</span>
        </button>
      </div>
    </div>
  </header>

  <!-- MAIN INTERACTIVE ARENA -->
  <main id="arena-container" class="relative flex-1 w-full overflow-hidden bg-[#090d16]">
    <canvas id="game-canvas"></canvas>

    <!-- Floating Active Weapon Tip Pill -->
    <div class="pointer-events-none absolute top-2.5 left-1/2 -translate-x-1/2 z-10 w-[92%] max-w-md flex justify-center">
      <div id="tool-hint-pill" class="px-3 py-1 rounded-full bg-slate-900/80 backdrop-blur-md border border-slate-700/70 text-[11px] sm:text-xs text-slate-300 font-medium shadow-lg flex items-center gap-2 truncate">
        <span class="w-2 h-2 rounded-full bg-cyan-400 shrink-0"></span>
        <span id="tool-hint-text" class="truncate">Tangan: Sentuh dan seret Oka lalu banting ke dinding!</span>
      </div>
    </div>

    <!-- Total Damage Counter subtle overlay -->
    <div class="pointer-events-none absolute top-11 left-3 z-10 flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-slate-950/60 border border-slate-800/80 text-[11px] text-slate-400">
      <span>Total Luka:</span>
      <span id="total-damage-value" class="font-bold text-slate-200 tabular-nums">0</span>
    </div>

    <!-- Non-intrusive Toast Notification -->
    <div id="toast-banner" class="pointer-events-none absolute bottom-3 left-1/2 -translate-x-1/2 z-30 opacity-0 translate-y-2 transition-all duration-200">
      <div id="toast-text" class="px-4 py-2 rounded-xl bg-slate-900/95 border border-cyan-500/40 text-xs font-bold text-cyan-200 shadow-xl whitespace-nowrap">
        Senjata terbuka!
      </div>
    </div>
  </main>

  <!-- BOTTOM COLLAPSIBLE / SCROLLABLE WEAPON DOCK -->
  <section id="weapon-dock" class="glass-panel relative z-20 border-t shrink-0 transition-all duration-200">
    <div class="max-w-6xl mx-auto">
      <!-- Category Tabs + Collapse Handle -->
      <div class="flex items-center justify-between px-2.5 pt-2 pb-1.5 gap-1 border-b border-slate-800/80">
        <div id="category-tabs" class="flex items-center gap-1 overflow-x-auto no-scrollbar py-0.5">
          <!-- Populated dynamically via JS -->
        </div>

        <button id="btn-toggle-dock" type="button" aria-label="Sembunyikan atau tampilkan panel senjata" class="ml-1 p-1.5 rounded-lg bg-slate-800/80 hover:bg-slate-700 text-slate-300 border border-slate-700/70 shrink-0 active:scale-95 transition">
          <svg id="icon-dock-chevron" class="w-4 h-4 transition-transform duration-200" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9" />
          </svg>
        </button>
      </div>

      <!-- Horizontal Weapon Cards List -->
      <div id="weapon-list-wrapper" class="px-2.5 py-2.5 overflow-hidden transition-all duration-200">
        <div id="weapon-cards" class="flex items-stretch gap-2 overflow-x-auto no-scrollbar pb-0.5">
          <!-- Populated dynamically via JS -->
        </div>
      </div>
    </div>
  </section>

  <script>
    (() => {
      'use strict';

      /* =========================================================================
       * 1. PROCEDURAL WEB AUDIO API SOUND ENGINE (ZERO EXTERNAL AUDIO FILES)
       * ========================================================================= */
      class SoundEngine {
        constructor() {
          this.ctx = null;
          this.enabled = true;
          this.lastVoiceTime = 0;
          this.lastChainsawTime = 0;
          this.lastLaserTime = 0;
          this.lastFlameTime = 0;
        }

        init() {
          if (!this.ctx) {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (AudioCtx) {
              this.ctx = new AudioCtx();
            }
          }
          if (this.ctx && this.ctx.state === 'suspended') {
            this.ctx.resume().catch(() => {});
          }
        }

        toggle() {
          this.enabled = !this.enabled;
          if (this.enabled) this.init();
          return this.enabled;
        }

        createNoiseBuffer(duration = 0.5) {
          if (!this.ctx) return null;
          const sampleRate = this.ctx.sampleRate;
          const length = Math.floor(sampleRate * duration);
          const buffer = this.ctx.createBuffer(1, length, sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < length; i++) {
            data[i] = Math.random() * 2 - 1;
          }
          return buffer;
        }

        playSlap(intensity = 1) {
          if (!this.enabled) return;
          this.init();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;

          // Sharp slap noise burst
          const noise = this.ctx.createBufferSource();
          noise.buffer = this.createNoiseBuffer(0.16);
          const filter = this.ctx.createBiquadFilter();
          filter.type = 'bandpass';
          filter.frequency.setValueAtTime(1100, now);
          filter.frequency.exponentialRampToValueAtTime(320, now + 0.14);
          filter.Q.value = 1.4;

          const gain = this.ctx.createGain();
          const vol = Math.min(0.65, 0.3 + intensity * 0.25);
          gain.gain.setValueAtTime(vol, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);

          noise.connect(filter);
          filter.connect(gain);
          gain.connect(this.ctx.destination);
          noise.start(now);

          // Low punch thud
          const osc = this.ctx.createOscillator();
          const oscGain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(160, now);
          osc.frequency.exponentialRampToValueAtTime(42, now + 0.14);
          oscGain.gain.setValueAtTime(vol * 0.9, now);
          oscGain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);

          osc.connect(oscGain);
          oscGain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.16);
        }

        playHammer() {
          if (!this.enabled) return;
          this.init();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;

          // Heavy sub thud
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(140, now);
          osc.frequency.exponentialRampToValueAtTime(28, now + 0.32);
          gain.gain.setValueAtTime(0.85, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.34);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.35);

          // Metallic clang overtone
          const clang = this.ctx.createOscillator();
          const cGain = this.ctx.createGain();
          clang.type = 'square';
          clang.frequency.setValueAtTime(520, now);
          clang.frequency.exponentialRampToValueAtTime(190, now + 0.18);
          cGain.gain.setValueAtTime(0.22, now);
          cGain.gain.exponentialRampToValueAtTime(0.001, now + 0.19);
          clang.connect(cGain);
          cGain.connect(this.ctx.destination);
          clang.start(now);
          clang.stop(now + 0.2);
        }

        playBlade(metallic = false) {
          if (!this.enabled) return;
          this.init();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;

          // Air whoosh
          const noise = this.ctx.createBufferSource();
          noise.buffer = this.createNoiseBuffer(0.18);
          const filter = this.ctx.createBiquadFilter();
          filter.type = 'highpass';
          filter.frequency.setValueAtTime(1800, now);
          filter.frequency.exponentialRampToValueAtTime(600, now + 0.16);

          const gain = this.ctx.createGain();
          gain.gain.setValueAtTime(0.32, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.17);

          noise.connect(filter);
          filter.connect(gain);
          gain.connect(this.ctx.destination);
          noise.start(now);

          if (metallic) {
            const freqs = [2450, 3680];
            freqs.forEach((f) => {
              const osc = this.ctx.createOscillator();
              const g = this.ctx.createGain();
              osc.type = 'sine';
              osc.frequency.setValueAtTime(f, now);
              osc.frequency.exponentialRampToValueAtTime(f * 0.88, now + 0.22);
              g.gain.setValueAtTime(0.14, now);
              g.gain.exponentialRampToValueAtTime(0.001, now + 0.24);
              osc.connect(g);
              g.connect(this.ctx.destination);
              osc.start(now);
              osc.stop(now + 0.25);
            });
          }
        }

        playChainsawTick() {
          if (!this.enabled) return;
          this.init();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          if (now - this.lastChainsawTime < 0.065) return;
          this.lastChainsawTime = now;

          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(95 + Math.random() * 45, now);
          osc.frequency.linearRampToValueAtTime(140 + Math.random() * 40, now + 0.06);

          gain.gain.setValueAtTime(0.22, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.065);

          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.07);
        }

        playGunshot(heavy = false) {
          if (!this.enabled) return;
          this.init();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const dur = heavy ? 0.36 : 0.18;

          const noise = this.ctx.createBufferSource();
          noise.buffer = this.createNoiseBuffer(dur);
          const filter = this.ctx.createBiquadFilter();
          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(heavy ? 2400 : 3400, now);
          filter.frequency.exponentialRampToValueAtTime(180, now + dur);

          const gain = this.ctx.createGain();
          gain.gain.setValueAtTime(heavy ? 0.65 : 0.42, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + dur);

          noise.connect(filter);
          filter.connect(gain);
          gain.connect(this.ctx.destination);
          noise.start(now);

          const punch = this.ctx.createOscillator();
          const pGain = this.ctx.createGain();
          punch.type = 'sine';
          punch.frequency.setValueAtTime(heavy ? 150 : 210, now);
          punch.frequency.exponentialRampToValueAtTime(36, now + 0.12);
          pGain.gain.setValueAtTime(heavy ? 0.6 : 0.35, now);
          pGain.gain.exponentialRampToValueAtTime(0.001, now + 0.13);
          punch.connect(pGain);
          pGain.connect(this.ctx.destination);
          punch.start(now);
          punch.stop(now + 0.14);
        }

        playLaserTick() {
          if (!this.enabled) return;
          this.init();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          if (now - this.lastLaserTime < 0.07) return;
          this.lastLaserTime = now;

          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(480 + Math.random() * 60, now);
          osc.frequency.exponentialRampToValueAtTime(290, now + 0.07);
          gain.gain.setValueAtTime(0.16, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.075);

          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.08);
        }

        playExplosion() {
          if (!this.enabled) return;
          this.init();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;

          // Sub-bass boom
          const sub = this.ctx.createOscillator();
          const subGain = this.ctx.createGain();
          sub.type = 'sine';
          sub.frequency.setValueAtTime(115, now);
          sub.frequency.exponentialRampToValueAtTime(22, now + 0.65);
          subGain.gain.setValueAtTime(0.95, now);
          subGain.gain.exponentialRampToValueAtTime(0.001, now + 0.68);
          sub.connect(subGain);
          subGain.connect(this.ctx.destination);
          sub.start(now);
          sub.stop(now + 0.7);

          // Roaring explosion noise
          const noise = this.ctx.createBufferSource();
          noise.buffer = this.createNoiseBuffer(0.75);
          const filter = this.ctx.createBiquadFilter();
          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(1200, now);
          filter.frequency.exponentialRampToValueAtTime(95, now + 0.72);

          const nGain = this.ctx.createGain();
          nGain.gain.setValueAtTime(0.75, now);
          nGain.gain.exponentialRampToValueAtTime(0.001, now + 0.74);

          noise.connect(filter);
          filter.connect(nGain);
          nGain.connect(this.ctx.destination);
          noise.start(now);
        }

        playFlameTick() {
          if (!this.enabled) return;
          this.init();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          if (now - this.lastFlameTime < 0.08) return;
          this.lastFlameTime = now;

          const noise = this.ctx.createBufferSource();
          noise.buffer = this.createNoiseBuffer(0.12);
          const filter = this.ctx.createBiquadFilter();
          filter.type = 'bandpass';
          filter.frequency.setValueAtTime(420 + Math.random() * 200, now);
          filter.Q.value = 0.8;

          const gain = this.ctx.createGain();
          gain.gain.setValueAtTime(0.24, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.11);

          noise.connect(filter);
          filter.connect(gain);
          gain.connect(this.ctx.destination);
          noise.start(now);
        }

        playLightning() {
          if (!this.enabled) return;
          this.init();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;

          // Electric zap crackle
          const noise = this.ctx.createBufferSource();
          noise.buffer = this.createNoiseBuffer(0.45);
          const filter = this.ctx.createBiquadFilter();
          filter.type = 'bandpass';
          filter.frequency.setValueAtTime(2800, now);
          filter.frequency.exponentialRampToValueAtTime(180, now + 0.42);
          filter.Q.value = 2.0;

          const gain = this.ctx.createGain();
          gain.gain.setValueAtTime(0.7, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.44);

          noise.connect(filter);
          filter.connect(gain);
          gain.connect(this.ctx.destination);
          noise.start(now);

          // Thunder rumble
          const osc = this.ctx.createOscillator();
          const oGain = this.ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(95, now);
          osc.frequency.exponentialRampToValueAtTime(30, now + 0.48);
          oGain.gain.setValueAtTime(0.45, now);
          oGain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
          osc.connect(oGain);
          oGain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.52);
        }

        playBlackHole() {
          if (!this.enabled) return;
          this.init();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;

          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(180, now);
          osc.frequency.exponentialRampToValueAtTime(48, now + 0.6);
          gain.gain.setValueAtTime(0.35, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.65);

          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.66);
        }

        playCoin() {
          if (!this.enabled) return;
          this.init();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;

          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(987.77, now); // B5
          osc.frequency.setValueAtTime(1318.51, now + 0.06); // E6
          gain.gain.setValueAtTime(0.16, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.24);

          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.25);
        }

          if (!this.enabled) return;
          this.init();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          if (now - this.lastVoiceTime < 0.35) return;
          this.lastVoiceTime = now;

          const osc = this.ctx.createOscillator();
          const filter = this.ctx.createBiquadFilter();
          const gain = this.ctx.createGain();

          osc.type = 'triangle';
          const baseFreq = pitchHigh ? 360 + Math.random() * 90 : 230 + Math.random() * 70;
          osc.frequency.setValueAtTime(baseFreq, now);
          osc.frequency.linearRampToValueAtTime(baseFreq * 1.28, now + 0.07);
          osc.frequency.exponentialRampToValueAtTime(baseFreq * 0.72, now + 0.2);

          filter.type = 'bandpass';
          filter.frequency.value = 900;
          filter.Q.value = 2.2;

          gain.gain.setValueAtTime(0.22, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.21);

          osc.connect(filter);
          filter.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.22);
        }

            { id: 'lHand',   x: cx - 44, y: cy + 10, ox: cx - 44, oy: cy + 10, r: 10, mass: 0.6 }, // 4
            { id: 'rElbow',  x: cx + 28, y: cy - 16, ox: cx + 28, oy: cy - 16, r: 9,  mass: 0.7 }, // 5
            { id: 'rHand',   x: cx + 44, y: cy + 10, ox: cx + 44, oy: cy + 10, r: 10, mass: 0.6 }, // 6
            { id: 'lKnee',   x: cx - 15, y: cy + 54, ox: cx - 15, oy: cy + 54, r: 10, mass: 0.8 }, // 7
            { id: 'lFoot',   x: cx - 18, y: cy + 90, ox: cx - 18, oy: cy + 90, r: 11, mass: 0.9 }, // 8
            { id: 'rKnee',   x: cx + 15, y: cy + 54, ox: cx + 15, oy: cy + 54, r: 10, mass: 0.8 }, // 9

          this.sticks = [
            { a: 0, b: 1, len: dist(0, 1), stiffness: 0.95 }, // Neck
            { a: 1, b: 2, len: dist(1, 2), stiffness: 0.98 }, // Spine
            { a: 1, b: 3, len: dist(1, 3), stiffness: 0.9 },  // L Upper Arm
            { a: 3, b: 4, len: dist(3, 4), stiffness: 0.9 },  // L Forearm
            { a: 1, b: 5, len: dist(1, 5), stiffness: 0.9 },  // R Upper Arm
            { a: 5, b: 6, len: dist(5, 6), stiffness: 0.9 },  // R Forearm
            { a: 2, b: 7, len: dist(2, 7), stiffness: 0.92 }, // L Thigh
            { a: 7, b: 8, len: dist(7, 8), stiffness: 0.92 }, // L Shin
            { a: 2, b: 9, len: dist(2, 9), stiffness: 0.92 }, // R Thigh
            { a: 9, b: 10, len: dist(9, 10), stiffness: 0.92 }, // R Shin

            { a: 7, b: 9, len: 28, stiffness: 0.08 }

          this.embeddedShurikens = [];
          this.pinnedSpear = null;
          this.bruises = [];

          this.burnTimer = 0;

        say(category = 'general', force = false) {
          const now = performance.now();
          if (!force && now - this.lastSpeechTime < 1250) return;
          const pool = OKA_QUOTES[category] || OKA_QUOTES.general;
          this.speechText = pool[Math.floor(Math.random() * pool.length)];
          this.speechTimer = 2.1;
          this.lastSpeechTime = now;
          sound.playOkaVoice(category === 'element' || category === 'sharp');
        }

        addDamage(amount, hitX, hitY, quoteCategory = 'general') {
          this.damage += amount;
          state.totalDamage += Math.round(amount);

          // Combo escalation
          state.combo = Math.min(99, state.combo + 1);
          state.comboTimer = 2.4;

          // Coin reward scaled slightly by combo
          const earned = Math.max(1, Math.round((amount * 0.28) * (1 + Math.min(state.combo, 15) * 0.05)));
          state.coins += earned;

          // Add visual bruise / bandage on torso or head
          if (this.bruises.length < 18 && Math.random() < 0.65) {
            const targetIdx = Math.random() < 0.45 ? 0 : (Math.random() < 0.5 ? 1 : 2);
            const node = this.nodes[targetIdx];
            const angle = Math.random() * Math.PI * 2;
            const rad = Math.random() * (node.r * 0.55);
            this.bruises.push({
              nodeIdx: targetIdx,
              ox: Math.cos(angle) * rad,
              oy: Math.sin(angle) * rad,
              isBandage: Math.random() < 0.45,
              rot: (Math.random() - 0.5) * 1.4
            });
          }

          this.say(quoteCategory);
          updateHUD();
        }

        applyImpulse(ix, iy, pointX = null, pointY = null, radius = 140) {
          for (let i = 0; i < this.nodes.length; i++) {
            const n = this.nodes[i];
            let factor = 1;
            if (pointX !== null && pointY !== null) {
              const d = Math.hypot(n.x - pointX, n.y - pointY);
              if (d > radius) continue;
              factor = Math.max(0.25, 1 - d / radius);
            }
            n.ox -= (ix * factor) / n.mass;
            n.oy -= (iy * factor) / n.mass;
          }
        }

        getClosestNode(x, y, maxDist = 90) {
          let best = null;
          let bestD = maxDist;
          for (let i = 0; i < this.nodes.length; i++) {
            const n = this.nodes[i];
            const d = Math.hypot(n.x - x, n.y - y);
            if (d < bestD) {
              bestD = d;
              best = n;
            }
          }
          return best;
        }

        getCenter() {
          const chest = this.nodes[1];
          return { x: chest.x, y: chest.y };

        update(dt, grabbedNode, pointerPos) {
          const bounds = getBounds();

          // Update timers
          if (this.speechTimer > 0) this.speechTimer -= dt;
          if (this.burnTimer > 0) {
            this.burnTimer -= dt;

            if (Math.random() < 0.35) {
              const randNode = this.nodes[Math.floor(Math.random() * this.nodes.length)];
              randNode.ox += (Math.random() - 0.5) * 7;
              randNode.oy += (Math.random() - 0.3) * 6;
